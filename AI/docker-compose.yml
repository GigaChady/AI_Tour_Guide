services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    healthcheck:
      test: [ "CMD-SHELL", "ollama list || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
    command: serve
    profiles: ["llm"]
    networks:
      - ai-network

  ollama-init:
    image: ollama/ollama:latest
    container_name: ai-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MODEL_NAME=${OLLAMA_MODEL:-mistral-nemo}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Checking Ollama model: $$MODEL_NAME"
        ollama list
        if ! ollama list | awk 'NR>1 {print $$1}' | grep -qx "$$MODEL_NAME"; then
          echo "Pulling model: $$MODEL_NAME"
          ollama pull $$MODEL_NAME
        else
          echo "Model already exists: $$MODEL_NAME"
        fi
    restart: "no"
    profiles: [ "llm" ]
    networks:
      - ai-network

  minio:
    image: minio/minio:latest
    container_name: tourguide-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin12345
    volumes:
      - minio_data:/data
    networks:
      - ai-network

  ai:
    build: .
    container_name: ai-narration
    env_file: .env
    environment:
      - AI_MOCK=${AI_MOCK:-true}
      - AI_RUN_STREAM_WORKER=${AI_RUN_STREAM_WORKER:-true}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PYTHONUNBUFFERED=1
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=localhost:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin12345
      - MINIO_BUCKET=poi-images
      - MINIO_SECURE=false
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
    volumes:
      - .:/app
    networks:
      - ai-network
    depends_on:
      - minio

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
        - ai-network

volumes:
  ollama_models:
    name: ollama_models
  minio_data:

networks:
  ai-network:
    name: ai-network

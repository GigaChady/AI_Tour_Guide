services:
  minio:
    image: minio/minio:latest
    container_name: tourguide-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin12345
    volumes:
      - minio_data:/data
    networks:
      - ai-network

  ai:
    build: .
    container_name: ai-narration
    env_file: .env
    environment:
      - AI_MOCK=${AI_MOCK:-true}
      - AI_RUN_STREAM_WORKER=${AI_RUN_STREAM_WORKER:-true}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PYTHONUNBUFFERED=1
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=localhost:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin12345
      - MINIO_BUCKET=poi-images
      - MINIO_SECURE=false
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
    volumes:
      - .:/app
    networks:
      - ai-network
    depends_on:
      - minio

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
        - ai-network

volumes:
  minio_data:

networks:
  ai-network:
    name: ai-network
